
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Plushie Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


    
    <header>
        <h1 class="store-title">🧸 Welcome to the Mini Plushie Store!</h1>
        <p>Your little corner of cuddles!</p>
    </header>

    <main>

        <!-- Search -->
        <section class="search-section">
            <input
                type="text"
                id="searchBox"
                placeholder="Search for plushies..."
            >
        </section>

        <!-- Currency Selector -->
        <section class="currency-selector">
            <label for="currency">Currency:</label>

            <select id="currency">
                <option value="MYR">🇲🇾 MYR</option>
                <option value="USD">🇺🇸 USD</option>
                <option value="EUR">🇪🇺 EUR</option>
            </select>
        </section>

        <!-- Products -->
        <section class="products-section">
            <h2>Our Plushies 💗</h2>
            <div class="output"></div>
        </section>

        <!-- Shopping Cart -->
        <section class="cart-section">
            <h2>🛒 Shopping Cart</h2>
            <div id="cartItems"></div>
            <h3 id="cartTotal">Total: RM 0.00</h3>
        </section>
        
<section class="checkout-section">
    <h2>💗 Checkout</h2>

    <div class="checkout-form">

        <label for="customerName">Customer Name</label>
        <input
            type="text"
            id="customerName"
            placeholder="Enter your name"
        >

        <label for="customerAddress">Delivery Address</label>
        <textarea
            id="customerAddress"
            placeholder="Enter your delivery address"
        ></textarea>

        <h3>Order Summary</h3>
        <div id="orderSummary"></div>

        <button id="placeOrder">
            Place Order 🛍️
        </button>

        <p id="orderMessage"></p>

    </div>
</section>


    </main>

    <footer>
        <p>© 2026 Mini Plushie Store</p>
    </footer>

    <script src="script.js"></script>

</body>
